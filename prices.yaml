# USD per 1M tokens, copied by hand from each provider's pricing page.
# Leave a value as TODO when unknown: cost is then reported as null, never guessed.
# free_tier: true -> the cost shown is a "list-price equivalent", not money spent.
models:
  # Gemini paid-tier list prices; the free tier is "Free of charge". Flash prices double from 2027-01-01.
  "gemini/gemini-3.6-flash":      { input_per_m: 0.75, output_per_m: 3.75, free_tier: true, source: "https://aistudio.google.com/docs/pricing (read 2026-11-09)" }
  "gemini/gemini-3.5-flash-lite": { input_per_m: 0.30, output_per_m: 2.50, free_tier: true, source: "https://aistudio.google.com/docs/pricing (read 2026-11-09)" }
  "gemini/gemini-3.1-flash-lite": { input_per_m: 0.25, output_per_m: 1.50, free_tier: true, source: "https://aistudio.google.com/docs/pricing (read 2026-11-09)" }
  "groq/openai/gpt-oss-120b":     { input_per_m: 0.15, output_per_m: 0.60, free_tier: true, source: "https://console.groq.com/docs/models (read 2026-11-09)" }
  "groq/openai/gpt-oss-20b":      { input_per_m: 0.075, output_per_m: 0.30, free_tier: true, source: "https://console.groq.com/docs/models (read 2026-11-09)" }
